<div class="container music-container">
    <h1>Pagina de Música</h1>
    <h3>Metzhery Xcaret</h3>
    <form id="form">
        <input type="text" id="search" placeholder="My You - Jungkook">
        <input type="submit" value="Buscar">
    </form>
    <section id="main" class="music-container"></section>
</div>
<script>
const main = document.getElementById('main');
const form = document.getElementById('form');
const search = document.getElementById('search');
form.addEventListener('submit', (e) => {
    e.preventDefault();
    const searchTerm = search.value.trim();
    if(searchTerm){
        getMusic(searchTerm);
    }
});

async function getMusic(query){
    const response = await fetch(
        `https://striveschool-api.herokuapp.com/api/deezer/search?q=${query}`
    );
    const data = await response.json();
    showMusic(data.data);
}

function showMusic(songs){
    main.innerHTML = '';
    if(songs.length === 0){
        main.innerHTML = `
            <h2>No se encontraron canciones 😿</h2>
        `;
        return;
    }
    songs.forEach((song) => {
        const songEl = document.createElement('div');
        songEl.classList.add('song');
        songEl.innerHTML = `
            <img src="${song.album.cover_big}" alt="${song.title}">
            <div class="song-info">
                <h2>${song.title}</h2>
                <p><strong>Artista:</strong> ${song.artist.name}</p>
                <p><strong>Álbum:</strong> ${song.album.title}</p>
                <audio controls>
                    <source src="${song.preview}" type="audio/mpeg">
                </audio>
            </div>
        `;
        main.appendChild(songEl);
    });
}
</script>
