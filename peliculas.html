<div class="container peliculas-container">
    <h1>Pagina de Peliculas</h1>
    <h3>Metzhery Xcaret</h3>
    <form id="form">
        <input type="text" id="search" placeholder="La Razón De Estar Contigo">
        <input type="submit" value="Buscar">
    </form>
    <section id="main" class="movies"></section>
</div>

<script>
const API_URL =
'https://api.themoviedb.org/3/discover/movie?sort_by=popularity.desc&api_key=3fd2be6f0c70a2a598f084ddfb75487c&page=1';
const IMG_PATH =
'https://image.tmdb.org/t/p/w1280';
const SEARCH_API =
'https://api.themoviedb.org/3/search/movie?api_key=3fd2be6f0c70a2a598f084ddfb75487c&query=';
const main = document.getElementById('main');
const form = document.getElementById('form');
const search = document.getElementById('search');
getMovies(API_URL);
async function getMovies(url){
    const res = await fetch(url);
    const data = await res.json();
    showMovies(data.results);
}

function showMovies(movies){
    main.innerHTML = '';
    movies.forEach((movie) => {
        const {
            title,
            poster_path,
            vote_average,
            overview,
            release_date
        } = movie;
        const movieEl = document.createElement('div');
        movieEl.classList.add('movie');
        movieEl.innerHTML = `
            <div class="movie-image">
                <img src="${IMG_PATH + poster_path}" alt="${title}">
                <div class="rating ${getClassByRate(vote_average)}">
                    ${vote_average}
                </div>
            </div>
            <div class="movie-info">
                <h3>${title}</h3>
                <p>${overview}</p>
                <p><strong>Estreno:</strong> ${release_date}</p>
            </div>
        `;
        main.appendChild(movieEl);
    });
}

function getClassByRate(vote){
    if(vote >= 8){
        return 'green';
    }else if(vote >= 5){
        return 'orange';
    }else{
        return 'red';
    }
}

form.addEventListener('submit', (e) => {
    e.preventDefault();
    const searchTerm = search.value;
    if(searchTerm && searchTerm !== ''){
        getMovies(SEARCH_API + searchTerm);
        search.value = '';
    }else{
        window.location.reload();
    }
});
</script>
